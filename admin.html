<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>管理画面</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { margin: 5px; padding: 10px 20px; font-size: 16px; }
    input { font-size: 16px; padding: 5px; }
  </style>
</head>
<body>
  <h1>管理画面（運営用）</h1>
  <label>番号：</label>
  <input id="num" type="number">

  <div style="margin-top: 20px;">
    <button onclick="updateStatus('making')">製作中</button>
    <button onclick="updateStatus('done')">完成</button>
    <button onclick="updateStatus('delivered')">お渡し</button>
  </div>
<div id="progress-container" style="margin-top: 20px; display: flex; gap: 20px;">
  <div style="flex: 1; border: 1px solid #ccc; padding: 10px; border-radius: 5px;">
    <h3>🛠️ 製作中リスト</h3>
    <ul id="making-list" style="font-size: 1.2rem; font-weight: bold; color: #ff9900;"></ul>
  </div>
  
  <div style="flex: 1; border: 1px solid #ccc; padding: 10px; border-radius: 5px;">
    <h3>🎉 完成リスト</h3>
    <ul id="done-list" style="font-size: 1.2rem; font-weight: bold; color: #00cc66;"></ul>
  </div>
</div>
<div id="lock-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #333; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;">
  <h2>🔒 運営専用ログイン</h2>
  <input type="password" id="admin-pass" placeholder="パスワードを入力" style="padding: 10px; font-size: 1.2rem; border-radius: 5px; border: none; text-align: center; margin-bottom: 15px;">
  <button onclick="checkPassword()" style="padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">認証する</button>
</div>
  <script src="script.js"></script>
</body>
</html>
